[package]
name = "moni-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows service that streams telemetry to the Moni clock"

[dependencies]
moni-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
