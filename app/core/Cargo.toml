[package]
name = "moni-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Telemetry sampling and transport shared by the Moni service and app"

[dependencies]
if-addrs = "0.15.0"
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
sysinfo = "0.38.4"
