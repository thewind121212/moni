[package]
name = "moni-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Telemetry sampling and transport shared by the Moni service and app"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12.1"
if-addrs = "0.15.0"
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
sha2 = "0.10.9"
sysinfo = "0.38.4"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
