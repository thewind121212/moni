[platformio]
default_envs = si_hai

[env:si_hai]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default.csv
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED
    -D ST7789_DRIVER
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_CS=-1
    -D CGRAM_OFFSET
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_GFXFF
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    bodmer/TFT_eSPI@2.5.43
    makuna/NeoPixelBus@2.7.7
